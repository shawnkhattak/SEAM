  <body>
    <script>
      (function() {
        var redirect = sessionStorage.getItem('seam-redirect');
        if (redirect) {
          sessionStorage.removeItem('seam-redirect');
          window.history.replaceState(null, '', redirect);
        }
        var base = '/SEAM';
        if (!redirect && window.location.pathname.startsWith(base)) {
          var real = window.location.pathname.slice(base.length) || '/';
          window.history.replaceState(null, '', real + window.location.search + window.location.hash);
        }
      })();
    </script>
    <div id="root"></div>
  </body>
