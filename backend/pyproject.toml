[project]
name = "seam-backend"
version = "0.1.0"
description = "FastAPI backend for SEAM — Singapore Entity Analytics for Maritime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    # Config + validation
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # HTTP client
    "httpx>=0.27",
    # Scheduling
    "apscheduler>=3.10",
    # Rate limiting
    "slowapi>=0.1.9",
    # News
    "feedparser>=6.0",
    "python-dateutil>=2.9",
    # AI
    "anthropic>=0.40",
    # Encryption (for app_config secrets)
    "cryptography>=43.0",
    # Observability
    "prometheus-client>=0.21",
    # Utilities
    "cachetools>=5.3",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "httpx>=0.27",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
