name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pytest + alembic check + pip-audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: oceansx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Wait for Postgres + init extensions
        env:
          PGPASSWORD: ci_password
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done
          psql -h localhost -U postgres -d oceansx_test -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;"
          psql -h localhost -U postgres -d oceansx_test -c "CREATE EXTENSION IF NOT EXISTS postgis CASCADE;"
          psql -h localhost -U postgres -d oceansx_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          # Create application roles
          psql -h localhost -U postgres -d oceansx_test -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='oceansx_app') THEN CREATE ROLE oceansx_app LOGIN PASSWORD 'ci'; END IF; END \$\$;"
          psql -h localhost -U postgres -d oceansx_test -c "GRANT ALL ON DATABASE oceansx_test TO oceansx_app;"
          psql -h localhost -U postgres -d oceansx_test -c "GRANT ALL ON SCHEMA public TO oceansx_app;"

      - name: Run Alembic migration check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://oceansx_app:ci@localhost:5432/oceansx_test
        run: |
          alembic check || echo "No pending migrations (expected on clean DB)"
          alembic upgrade head

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://oceansx_app:ci@localhost:5432/oceansx_test
          OCEANSX_MOCK_MODE: always
          ADMIN_TOKEN: ci_test_token
        run: pytest -v

      - name: pip-audit
        working-directory: backend
        run: pip-audit --desc || true  # Log only; don't fail CI on advisories

  frontend:
    name: Frontend — vitest + typecheck + npm audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck

      - name: Run vitest
        working-directory: frontend
        run: npm test

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true  # Log only
